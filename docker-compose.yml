services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: YourNewStrongPassword
      POSTGRES_DB: MarketPlaceApi
    ports:
      - "5433:5432"
    volumes:
      - marketplace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MarketPlaceApi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "5000:80"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=MarketPlaceApi;Username=postgres;Password=YourNewStrongPassword"
      ASPNETCORE_URLS: "http://+:80"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  marketplace_pgdata:
